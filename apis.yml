name: Storia Originals, Inc.
description: Storia Originals, Inc. (doing business as Storiaverse) was a Los Angeles-based consumer
  mobile entertainment startup founded in 2023 by Agnes Kozera and David Kierzkowski. Its Storiaverse
  app pioneered a patent-pending "read-watch" format blending short-form reading, animation, and audio,
  connecting writers and animators to publish and monetize original stories across sci-fi, fantasy,
  horror, mystery, and comedy, including adaptations of HarperCollins titles. It raised a pre-seed round
  led by 500 Global. As of this enrichment pass the company exposes no public API, SDK, or developer
  platform; both its marketing site (storia.io) and its iOS/Android app store listings are no longer
  reachable (all HTTP 404), indicating the product is inactive or has been wound down.
